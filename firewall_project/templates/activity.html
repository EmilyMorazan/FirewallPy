    <div class="activity_graph">
        <canvas id="myChart" width="1000" height="500"></canvas>
        <script>
            const ctx = document.getElementById('myChart').getContext('2d');
            const myChart = new Chart(ctx,
                {
                    type: 'line', // You can also use 'bar', 'pie', 'doughnut', etc.
                    data:
                    {
                        labels: [], // X axis
                        datasets:
                            [{
                                label: 'Network Speed Mbp/s',
                                data: [], // Y axis
                                borderColor: 'rgba(75, 192, 192, 1)',
                                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                                fill: true,
                                tension: 0.4 // makes the line curved
                            }]
                    },
                    options:
                    {
                        responsive: true,
                        plugins:
                        {
                            title:
                            {
                                display: true,
                                text: 'Network Activity'
                            }
                        }
                    }
                });

            let speed;

            async function fetchSpeed() {
                const res = await fetch('/network_speed');
                const data = await res.json();
                speed = data.download;

            }

            function updateGraph() {
                const current_time = new Date().toLocaleTimeString();

                if (myChart.data.labels.length > 20) {
                    myChart.data.labels.shift();
                    myChart.data.datasets[0].data.shift();
                }

                myChart.data.labels.push(current_time);
                myChart.data.datasets[0].data.push(speed);
                myChart.update();
            }

            // Updating the graph every 1 seconds
            setInterval(fetchSpeed, 1000); // Poll every 2 seconds
            setInterval(updateGraph, 1000);



            document.addEventListener("DOMContentLoaded", function () {
                const savedTheme = localStorage.getItem("theme");
                if (savedTheme === "dark") {
                    document.body.classList.add("dark-mode");
                }
            });
        </script>

    </div>
