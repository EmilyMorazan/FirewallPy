<!DOCTYPE html>

    body {

    h2 {

  <table id="packetTable">
    <thead>
      <tr>
        <th>Date and Time</th>
        <th>Source</th>
        <th>Destination</th>
        <th>Protocol</th>
        <th>Speed</th>
      </tr>
    </thead>
    <tbody>
      <!-- Packet data rows will be inserted here -->
    </tbody>
  </table>


  <script>

    // function callPythonFunction() {

    //   fetch('/greet', {

    //   })
    //     .then(response => response.json())
    //     .then(data => {
    //       document.getElementById('result').innerHTML = data.message;
    //     });
    // }


    function loadPacketData() {
      fetch('/get_packets')
        .then(response => response.json())
        .then(data => {
          const tableBody = document.querySelector('#packetTable tbody');
          tableBody.innerHTML = '';

          // Show more packets (increased from 20 to 50)
          data.slice(-50).reverse().forEach(packet => {
            const row = document.createElement('tr');
            row.innerHTML = `
              <td>${packet.time}</td>
              <td>${packet.src_ip}</td>
              <td>${packet.dst_ip}</td>
              <td>${packet.protocol}</td>
              <td>${packet.speed}</td>
            `;
            tableBody.appendChild(row);
          });
        })
        .catch(err => {
          console.error('Error loading packet data:', err);
        });
    }

    // Automatically load on page load
    window.onload = loadPacketData;

    function restartTraffic() {
      fetch('/clear_traffic', { method: 'POST' })
        .then(response => response.json())
        .then(result => {
          console.log(result.message);
          loadPacketData(); // Refresh table after clearing
        })
        .catch(err => console.error('Error resetting traffic:', err));
    }

    // Set interval to refresh data more frequently (every 2 seconds instead of 3)
    setInterval(loadPacketData, 2000);

    // Dark mode toggle
    document.addEventListener("DOMContentLoaded", function () {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") {
        document.body.classList.add("dark-mode");
      } else {
        document.body.classList.remove("dark-mode");
      }
    });
  </script>
