  <script>
    window.addEventListener("DOMContentLoaded", function () {
      const stored = localStorage.getItem("theme") || "light";
      const slider = document.getElementById("mode-slider");

      if (slider) {
        slider.value = stored === "dark" ? 1 : 0;
        toggleMode(slider); // Properly apply full theme

    });

    <br />
    <script>  document.addEventListener("DOMContentLoaded", function () {
        const homeChartEl = document.getElementById("homeNetworkChart");
        // trying for naother chart
        // const connectionsChartEl = document.getElementById("trafficOverviewChart");
        if (!homeChartEl) return; // Exit if chart doesn't exist on this page

        const ctx = homeChartEl.getContext("2d");
        const homeChart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: [],
            datasets: [{
              label: 'Download Speed (Mbps)',
              data: [],
              borderColor: 'rgba(75, 192, 192, 1)',
              backgroundColor: 'rgba(75, 192, 192, 0.2)',
              fill: true,
              tension: 0.4
            }]
          },
          options: {
            responsive: true,
            plugins: {
              title: {
                display: false
              }
            },
            scales: {
              y: {
                beginAtZero: true
              }
            }
          }
        });

        let speed = 0;

        async function fetchSpeed() {
          try {
            const res = await fetch("/network_speed");
            const data = await res.json();
            speed = data.download;
          } catch (e) {
            console.error("Failed to fetch speed", e);
          }
        }

        function updateChart() {
          const now = new Date().toLocaleTimeString();
          if (homeChart.data.labels.length > 20) {
            homeChart.data.labels.shift();
            homeChart.data.datasets[0].data.shift();
          }
          homeChart.data.labels.push(now);
          homeChart.data.datasets[0].data.push(speed);
          homeChart.update();
        }

        setInterval(fetchSpeed, 1000);
        setInterval(updateChart, 1000);
      });

      // calculate traffic overview: 
      let trafficChart;

      document.addEventListener("DOMContentLoaded", function () {
        const trafficChartEl = document.getElementById("trafficOverviewChart");
        if (!trafficChartEl) return;

        const trafficCtx = trafficChartEl.getContext("2d");

        const trafficChart = new Chart(trafficCtx, {
          type: "bar",
          data: {
            labels: ["TCP", "UDP"],
            datasets: [{
              label: "Connections",
              data: [0, 0],
              // backgroundColor: ["#b10fde", "#de0fd7"]
              backgroundColor: getTrafficColors()
            }]
          },
          options: {
            responsive: true,
            scales: {
              y: {
                beginAtZero: true
              }
            }
          }
        });

        // ✅ Fetch traffic data repeatedly
        async function fetchTrafficData() {
          try {
            const res = await fetch("/traffic_overview");
            const data = await res.json();

            // ✅ Add this line to debug the response:
            console.log("Traffic overview data:", data);

            trafficChart.data.datasets[0].data = [
              data.TCP || 0,
              data.UDP || 0
            ];
            // Update the chart with new colors: 
            trafficChart.data.datasets[0].backgroundColor = getTrafficColors();
            trafficChart.update();
          } catch (e) {
            console.error("Failed to fetch traffic overview", e);
          }
        }

        // added:
        fetchTrafficData(); // Call once immediately
        setInterval(fetchTrafficData, 2000); // Then every 2 seconds

      });

      function getTrafficColors() {
        const isDark = document.body.classList.contains("dark-mode");
        return isDark ? ["#4caf50", "#2196F3"] : ["#b10fde", "#de0fd7"];
      }

      document.addEventListener("DOMContentLoaded", function () {
        const homeChartEl = document.getElementById("homeNetworkChart");
        if (!homeChartEl) return;

        // Function to update IP tables
        function updateIPTables() {
          fetch('/top_bandwidth_ips')
            .then(response => response.json())
            .then(data => {
              // Sort and filter blocked IPs
              const blockedIPs = data
                .filter(ip => ip.blocked)
                .sort((a, b) => b.packets - a.packets)
                .slice(0, 5);

              // Sort and filter allowed IPs
              const allowedIPs = data
                .filter(ip => !ip.blocked)
                .sort((a, b) => b.packets - a.packets)
                .slice(0, 5);

              // Update blocked IPs table
              const blockedTableBody = document.querySelector('#blockedIpsTable tbody');
              blockedTableBody.innerHTML = '';
              blockedIPs.forEach(ip => {
                const row = document.createElement('tr');
                row.innerHTML = `
                <td>${ip.ip}</td>
                <td>${ip.packets}</td>
              `;
                blockedTableBody.appendChild(row);
              });

              // Update allowed IPs table
              const allowedTableBody = document.querySelector('#allowedIpsTable tbody');
              allowedTableBody.innerHTML = '';
              allowedIPs.forEach(ip => {
                const row = document.createElement('tr');
                row.innerHTML = `
                <td>${ip.ip}</td>
                <td>${ip.packets}</td>
              `;
                allowedTableBody.appendChild(row);
              });
            })
            .catch(error => {
              console.error('Error fetching IP data:', error);
            });
        }

        // Initial update
        updateIPTables();

        // Update every 5 seconds
        setInterval(updateIPTables, 5000);

        // Rest of your existing chart code...
      });

    </script>
